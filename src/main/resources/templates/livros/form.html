<!DOCTYPE html>
<!--
  CAMADA VIEW — formulário de livro (cadastro E edição).
  th:object="${livro}"   -> liga o formulário ao objeto Livro do Model
  th:field="*{titulo}"   -> liga o campo ao atributo titulo (gera name, id e value)
  th:errors="*{titulo}"  -> mostra a mensagem de validação daquele campo
  Campo escondido id     -> vazio = cadastro novo; preenchido = edição
-->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina}">Livro</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
  <header class="topo">
    <a class="marca" th:href="@{/livros}">Livraria · CRUD de Livros</a>
  </header>

  <main>
    <p><a th:href="@{/livros}">&larr; Voltar para a lista</a></p>
    <h1 th:text="${tituloPagina}">Novo livro</h1>

    <form class="formulario" th:action="@{/livros/salvar}" th:object="${livro}" method="post" novalidate>
      <input type="hidden" th:field="*{id}">

      <label for="titulo">Título *</label>
      <input type="text" th:field="*{titulo}" th:errorclass="campo-erro" maxlength="150">
      <span class="msg-erro" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">Erro</span>

      <label for="autor">Autor *</label>
      <input type="text" th:field="*{autor}" th:errorclass="campo-erro" maxlength="100">
      <span class="msg-erro" th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}">Erro</span>

      <label for="anoPublicacao">Ano de publicação *</label>
      <input type="number" th:field="*{anoPublicacao}" th:errorclass="campo-erro" placeholder="2024">
      <span class="msg-erro" th:if="${#fields.hasErrors('anoPublicacao')}" th:errors="*{anoPublicacao}">Erro</span>

      <label for="preco">Preço (R$) *</label>
      <input type="number" step="0.01" th:field="*{preco}" th:errorclass="campo-erro" placeholder="39.90">
      <span class="msg-erro" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">Erro</span>

      <div class="acoes">
        <button class="btn" type="submit">Salvar</button>
        <a th:href="@{/livros}">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
