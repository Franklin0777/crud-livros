spring.application.name=crud-livros
server.port=8080
# Segurança: o identificador da sessão fica só no cookie, nunca no endereço da página
server.servlet.session.tracking-modes=cookie

# ===== Banco de dados: MySQL do XAMPP =====
# Antes de rodar: XAMPP -> Start no MySQL e criar o banco "livraria" no phpMyAdmin.
# Variáveis de ambiente com valor padrão:  ${NOME:padrão}
#   DB_PORT     -> porta do MySQL (padrão 3306)
#   DB_USER     -> usuário (padrão root)
#   DB_PASSWORD -> senha (padrão vazia, como no XAMPP). A senha NUNCA fica escrita aqui.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/livraria?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O Hibernate cria e atualiza a tabela "livros" a partir da classe Livro
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Recarrega o HTML sem reiniciar (só em desenvolvimento)
spring.thymeleaf.cache=false
